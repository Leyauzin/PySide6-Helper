[build-system]
requires = ["setuptools>=68", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "uiwrapper"
version = "0.1.2"
description = "A chainable PySide6 UI wrapper for building desktop apps fast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6"]

[project.urls]
Homepage = "https://github.com/Leyauzin/PySide6-Helper-uiwrapper-docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["ui*"]
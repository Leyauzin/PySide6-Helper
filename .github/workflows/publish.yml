name: Build & Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: pip install cython "setuptools>=68" wheel build PySide6

      - name: Compiler avec Cython
        run: python setup.py build_ext --inplace

      - name: Builder le wheel (binaire)
        run: python -m build --wheel

      - name: Supprimer les .py sources
        shell: bash
        run: |
          rm -f ui/ui_tools.py
          rm -f ui/ui_inspector.py

      - name: Réparer le wheel Linux (manylinux)
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel patchelf
          auditwheel repair dist/*.whl --wheel-dir dist/
          rm dist/*linux_x86_64.whl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer twine
        run: pip install twine

      - name: Publier sur PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*.whl